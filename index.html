<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloth Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Cloth Ordering System</h1>

  <div class="container">

    <!-- Product Card -->
    <div class="card">
      <img src="images/shirt1.jpg" alt="Shirt">

      <h2>Blue Shirt</h2>

      <p>₹799</p>

      <button onclick="addToCart('Blue Shirt',799)">
        Add to Cart
      </button>
    </div>

  </div>

  <!-- Cart -->
  <div class="cart">

    <h2>My Cart</h2>

    <ul id="cartItems"></ul>

    <h3>Total: ₹<span id="total">0</span></h3>

  </div>

  <script src="script.js"></script>

</body>
</html>
