<!DOCTYPE html>
<html>
<head>
  <title>My Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="index.html" class="cartBtn">⬅ Back</a>

<h1>My Cart 🛒</h1>

<div id="cart"></div>

<h2 id="total"></h2>

<h3>Payment</h3>

<label><input type="radio" name="pay"> Online Payment</label><br>
<label><input type="radio" name="pay"> Cash on Delivery</label>

<br><br>

<button onclick="order()">Order Now</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;
let cartDiv = document.getElementById("cart");

cart.forEach(item=>{
  total += item.price * item.qty;

  cartDiv.innerHTML += `
    <div class="card">
      <h3>${item.name}</h3>
      <p>${item.price} x ${item.qty}</p>
      <p>Total: ₹${item.price * item.qty}</p>
    </div>
  `;
});

document.getElementById("total").innerText = "Grand Total: ₹" + total;

// ORDER
function order(){
  alert("Order Placed Successfully!");
  localStorage.removeItem("cart");
  location.href="index.html";
}
</script>

</body>
</html>
